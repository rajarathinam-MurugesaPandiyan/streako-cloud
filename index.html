<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- MANDATORY: Declare support for both light and dark themes -->
    <meta name="color-scheme" content="light dark" />
    <script>
      // FOUC Prevention: apply stored theme preference immediately before render
      try {
        const storedTheme = localStorage.getItem("streako-theme");
        if (storedTheme === "light" || storedTheme === "dark") {
          document.querySelector('meta[name="color-scheme"]').content = storedTheme;
        }
      } catch (e) {}
    </script>

    <title>Streako — Tap • Track • Triumph | The Habit Tracker That Sticks</title>
    <meta
      name="description"
      content="Turn daily actions into life-changing routines. Build unstoppable streaks, set smart AlarmKit reminders, and conquer your goals with Streako."
    />

    <!-- Favicon & Touch Icon -->
    <link rel="icon" type="image/png" href="/assets/streako.png" />
    <link rel="apple-touch-icon" href="/assets/streako.png" />

    <!-- Google Fonts: Lexend (Streako Design System Typography) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Lottie Web Player -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"
      defer
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
